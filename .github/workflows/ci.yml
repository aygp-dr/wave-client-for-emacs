name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Generate README.md from README.org
        run: |
          # Simple org to markdown conversion for CI
          sed 's/^\* /# /; s/^\*\* /## /; s/^\*\*\* /### /; s/^- /- /; s/=\([^=]*\)=/`\1`/g; s/\[\[file:\([^]]*\)\]\]/\1/g; s/\[\[\([^]]*\)\]\[\([^]]*\)\]\]/[\2](\1)/g' README.org > README.md

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy src/

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Generate README.md from README.org
        run: |
          sed 's/^\* /# /; s/^\*\* /## /; s/^\*\*\* /### /; s/^- /- /; s/=\([^=]*\)=/`\1`/g; s/\[\[file:\([^]]*\)\]\]/\1/g; s/\[\[\([^]]*\)\]\[\([^]]*\)\]\]/[\2](\1)/g' README.org > README.md

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Start server for integration tests
        run: |
          uv run uvicorn wave_client_server.wave_server:app --host 0.0.0.0 --port 9898 &
          sleep 5

      - name: Run integration tests
        run: uv run pytest tests/integration -v

  elisp-lint:
    name: Elisp Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      - name: Byte-compile Elisp files
        run: |
          emacs -Q --batch \
            -L lisp \
            --eval "(setq byte-compile-error-on-warn nil)" \
            -f batch-byte-compile lisp/*.el 2>&1 | tee compile-output.txt
          # Check for errors (not warnings)
          if grep -q "^lisp/.*:.*:Error:" compile-output.txt; then
            echo "Byte-compilation errors found!"
            exit 1
          fi

      - name: Check Elisp files load without errors
        run: |
          emacs -Q --batch \
            -L lisp \
            --eval "(require 'cl)" \
            -l wave-util \
            -l wave-data \
            -l websocket \
            -l wave-client-websocket \
            -l wave-client \
            -l wave-update \
            -l wave-display \
            -l wave-edit \
            -l wave-list \
            --eval "(message \"All wave-client modules loaded successfully\")"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Generate README.md from README.org
        run: |
          sed 's/^\* /# /; s/^\*\* /## /; s/^\*\*\* /### /; s/^- /- /; s/=\([^=]*\)=/`\1`/g; s/\[\[file:\([^]]*\)\]\]/\1/g; s/\[\[\([^]]*\)\]\[\([^]]*\)\]\]/[\2](\1)/g' README.org > README.md

      - name: Install dependencies
        run: uv sync

      - name: Check for secrets
        run: |
          # Check for common secret patterns
          if grep -rE "(password|secret|api_key|token)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.py" | grep -v "example\|test\|mock"; then
            echo "Potential secrets found in code!"
            exit 1
          fi
          echo "No secrets detected"

      - name: Check for hardcoded credentials
        run: |
          # Ensure no .env files with real values
          if [ -f .env ] && grep -qE "^[A-Z_]+=.+$" .env 2>/dev/null; then
            echo "Warning: .env file contains values"
          fi
          echo "Credential check passed"

  api-contract:
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OpenAPI spec
        run: |
          npx @redocly/cli lint specs/wave-api.openapi.yaml --skip-rule=no-unused-components

      - name: Check for breaking changes (on PR)
        if: github.event_name == 'pull_request'
        run: |
          # Get the base branch spec
          git show origin/${{ github.base_ref }}:specs/wave-api.openapi.yaml > /tmp/base-spec.yaml 2>/dev/null || echo "No base spec found"
          if [ -f /tmp/base-spec.yaml ]; then
            npx oasdiff breaking /tmp/base-spec.yaml specs/wave-api.openapi.yaml --fail-on ERR || {
              echo "::warning::Breaking API changes detected! Review carefully."
            }
          fi

      - name: Generate API diff summary
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:specs/wave-api.openapi.yaml > /tmp/base-spec.yaml 2>/dev/null || exit 0
          echo "## API Changes" >> $GITHUB_STEP_SUMMARY
          npx oasdiff changelog /tmp/base-spec.yaml specs/wave-api.openapi.yaml --format markdown >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No changes detected" >> $GITHUB_STEP_SUMMARY
