name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy src/

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Start server for integration tests
        run: |
          uv run uvicorn wave_client_server.wave_server:app --host 0.0.0.0 --port 9898 &
          sleep 5

      - name: Run integration tests
        run: uv run pytest tests/integration -v

  elisp-lint:
    name: Elisp Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      - name: Byte-compile Elisp files
        run: |
          emacs -Q --batch \
            -L lisp \
            --eval "(setq byte-compile-error-on-warn nil)" \
            -f batch-byte-compile lisp/*.el 2>&1 | tee compile-output.txt
          # Check for errors (not warnings)
          if grep -q "^lisp/.*:.*:Error:" compile-output.txt; then
            echo "Byte-compilation errors found!"
            exit 1
          fi

      - name: Check Elisp files load without errors
        run: |
          emacs -Q --batch \
            -L lisp \
            --eval "(require 'cl)" \
            -l wave-util \
            -l wave-data \
            -l websocket \
            -l wave-client-websocket \
            -l wave-client \
            -l wave-update \
            -l wave-display \
            -l wave-edit \
            -l wave-list \
            --eval "(message \"All wave-client modules loaded successfully\")"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Check for secrets
        run: |
          # Check for common secret patterns
          if grep -rE "(password|secret|api_key|token)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.py" | grep -v "example\|test\|mock"; then
            echo "Potential secrets found in code!"
            exit 1
          fi
          echo "No secrets detected"

      - name: Check for hardcoded credentials
        run: |
          # Ensure no .env files with real values
          if [ -f .env ] && grep -qE "^[A-Z_]+=.+$" .env 2>/dev/null; then
            echo "Warning: .env file contains values"
          fi
          echo "Credential check passed"
