[project]
name = "wave-client-server"
version = "0.2.2"
description = "Wave Client for Emacs - FastAPI server with WebSocket support"
readme = "README.md"
authors = [
    { name = "Aidan Pace", email = "apace@defrecord.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "PyJWT>=2.8.0",
    "sqlalchemy>=2.0.42",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "hypothesis>=6.100",
]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "mutmut>=3.0",
]

[project.scripts]
wave-client-server = "wave_client_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long - let black handle this
    "B008",  # Depends() in function defaults is standard FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841"]  # unused variables OK in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Relax type checking for now - the codebase needs comprehensive type annotations
# TODO: Enable strict checking incrementally

[[tool.mypy.overrides]]
module = ["wave_client_server.*"]
ignore_errors = true

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mutmut]
# Scope: the modules whose bugs would mislead the Emacs client.
# Run: HYPOTHESIS_PROFILE=mutation uv run --extra test --extra dev mutmut run
paths_to_mutate = ["src/wave_client_server/user_api.py", "src/wave_client_server/fedone.py"]
tests_dir = ["tests/test_user_api.py", "tests/test_fedone.py", "tests/test_properties.py", "tests/conftest.py"]
also_copy = ["resources", "src/wave_client_server"]
pytest_add_cli_args = ["-p", "no:warnings", "-q", "-p", "no:cacheprovider"]
