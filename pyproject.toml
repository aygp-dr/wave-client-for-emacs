[project]
name = "wave-client-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aidan Pace", email = "apace@defrecord.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "sqlalchemy>=2.0.42",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
]

[project.scripts]
wave-client-server = "wave_client_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
